<title>Clinic Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#eef3f5;--ink:#12303b;--pri:#0b6e7f;--soft:#dcebee;--alert:#b4261e;--line:#c3d4d9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:20px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
#app{max-width:640px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 90px}
h1{font-size:28px;margin:8px 0 18px}h2{font-size:26px;margin:6px 0 16px;line-height:1.25}
button{font:inherit;border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:16px 18px;width:100%;margin:0 0 10px;text-align:left;min-height:60px}
button.on{background:var(--soft);border-color:var(--pri);font-weight:600}
button.go{background:var(--pri);color:#fff;border-color:var(--pri);text-align:center;font-weight:600}
button.sec{text-align:center;background:transparent}button.go.danger{background:var(--alert);border-color:var(--alert)}
button.lang{font-size:28px;padding:26px 20px}
.langpage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:4vh 0 2vh}
.langhead{margin-bottom:22px}.langhead h1{margin:6px 0 4px;font-size:34px;text-wrap:balance}
.langicon{width:76px;height:76px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;background:var(--soft);border:3px solid var(--t3,#ffc56e)}
.langsub{font-size:21px;font-weight:600;color:var(--t2,#b85f06)}
.langs{display:flex;flex-direction:column;gap:14px;width:100%;max-width:520px}
.langs button.lang{margin:0;text-align:center;font-weight:700;font-size:30px;color:#fff;border:0;border-radius:22px;padding:22px 20px 18px;box-shadow:0 10px 22px -10px rgba(91,42,4,.55),0 2px 0 rgba(255,255,255,.35) inset;transition:transform .12s}
.langs button.lang:active{transform:scale(.98)}
.langs button.lang small{font-size:17px;font-weight:600;opacity:.9;margin-top:2px}
.langpage+.meta{text-align:center}
.lang-en{background:linear-gradient(180deg,#e88a1c,#b85f06)}
.lang-es{background:linear-gradient(180deg,#d9622b,#a8401a)}
.lang-ht{background:linear-gradient(180deg,#c28a16,#8f5f05)}button.lang small{display:block;font-size:16px;font-weight:400;opacity:.7}
input[type=text],input[type=password],input[type=date],textarea{font:inherit;width:100%;padding:16px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}
textarea{min-height:120px}
.row{display:flex;gap:10px}.row button{text-align:center}
.bar{height:8px;background:var(--soft);border-radius:4px;margin-bottom:18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.scale button{text-align:center;padding:14px 0;margin:0}
.hint{display:flex;justify-content:space-between;font-size:16px;opacity:.75;margin:8px 2px 16px}
.staff{position:fixed;right:10px;bottom:max(8px,env(safe-area-inset-bottom));width:auto;padding:8px 14px;min-height:0;font-size:15px;opacity:.5;margin:0}
.big{font-size:80px;text-align:center;margin:40px 0 0}
.card{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.card.flag{border-color:var(--alert)}.card.new{border-left:10px solid var(--pri)}
.card b{font-size:22px}.meta{font-size:16px;opacity:.75}
.pk{background:#f28c00}.tag{display:inline-block;background:var(--alert);color:#fff;border-radius:8px;padding:2px 9px;font-size:15px;margin:4px 6px 0 0}
.qa{border-top:1px solid var(--line);padding:8px 0;font-size:17px}.qa span{opacity:.65;display:block;font-size:15px}
.status{padding:8px 12px;border-radius:10px;font-size:16px;margin-bottom:12px}.status.ok{background:#d8f0dd}.status.off{background:#fbe9c8}
.qh{display:flex;gap:12px;align-items:flex-start}.qh h1,.qh h2{flex:1}button.spk{width:60px;height:60px;flex:none;padding:0;text-align:center;font-size:28px;border-radius:50%;margin:0}button.mic{margin:10px 0 0}button.mic.on{background:#fbe9c8;border-color:var(--alert)}
.vit{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.fld label{font-size:16px;display:block}.fld input,.fld textarea{margin:4px 0 8px;padding:12px}.tr{color:var(--pri);font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}.tabs button{flex:1;min-width:100px;margin:0;padding:12px 6px;font-size:16px;text-align:center;min-height:0}
.chk{display:flex;align-items:center;gap:10px;padding:10px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;font-size:18px}.chk input{width:26px;height:26px}
select{font:inherit;width:100%;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;margin:4px 0 8px}
@media print{body *{visibility:hidden}#slip,#slip *{visibility:visible}#slip{position:absolute;left:0;top:0;width:100%}}
.ens{display:block;font-size:16px;font-weight:400;opacity:.75;color:inherit;margin-top:2px}h2+.ens{font-size:19px;opacity:.7;margin:0 0 14px}

/* ---------- section themes (3D look) : change the colours here ---------- */
body[data-th=reg]{--t1:#0a3d22;--t2:#1b8a4b;--t3:#7be0a4;--pri:#17803f;--soft:#d9f2e2;--line:#bfdcc9;--lab:"📋  REGISTRATION"}
body[data-th=nurse]{--t1:#071a3d;--t2:#143d8f;--t3:#6ea4ff;--pri:#0f3b91;--soft:#dbe6fb;--line:#c0cde6;--lab:"🩺  NURSE STATION"}
body[data-th=doctor]{--t1:#053a44;--t2:#0b8497;--t3:#6fe3f2;--pri:#0a7487;--soft:#d6f0f4;--line:#bcdce2;--lab:"⚕️  DOCTOR"}
body[data-th=pharmacy]{--t1:#2e0d52;--t2:#7b2fbf;--t3:#d3a4ff;--pri:#6a1b9a;--soft:#eddcf7;--line:#d7c3e6;--lab:"💊  PHARMACY"}
body[data-th=admin]{--t1:#182126;--t2:#46606c;--t3:#a8c2cf;--pri:#37505c;--soft:#e0e8ec;--line:#c8d3d9;--lab:"⚙️  ADMIN"}
body[data-th=signin]{--t1:#1a1f3d;--t2:#3d4a9e;--t3:#a5b0ff;--pri:#34408f;--soft:#e1e4f7;--line:#c9cde6;--lab:"🔐  STAFF SIGN-IN"}
body[data-th=checkin]{--t1:#5b2a04;--t2:#d9760f;--t3:#ffc56e;--pri:#b85f06;--soft:#fbe7cc;--line:#ecd3b0;--lab:"🧾  PATIENT SIGN-IN"}
body[data-th=display]{--t1:#030b1c;--t2:#0b2a5b;--t3:#3d8bff;--pri:#8be9ff;--lab:none}
body[data-th]{background:radial-gradient(1100px 650px at 8% -8%,var(--t3),transparent 62%),radial-gradient(900px 700px at 108% 12%,var(--t2),transparent 65%),linear-gradient(158deg,var(--t1) 0%,var(--t2) 55%,var(--t1) 100%) fixed;min-height:100vh}
body[data-th]::before{content:"";position:fixed;left:0;top:0;right:0;bottom:0;z-index:0;pointer-events:none;
 background:radial-gradient(circle closest-side at 34% 30%,rgba(255,255,255,.75),transparent) -4% 62%/340px 340px no-repeat,
  radial-gradient(circle closest-side at 50% 50%,rgba(255,255,255,.3),rgba(255,255,255,.12) 60%,rgba(0,0,0,.1) 92%,transparent) -4% 62%/340px 340px no-repeat,
  radial-gradient(circle closest-side at 34% 30%,rgba(255,255,255,.75),transparent) 104% 8%/260px 260px no-repeat,
  radial-gradient(circle closest-side at 50% 50%,rgba(255,255,255,.3),rgba(255,255,255,.12) 60%,rgba(0,0,0,.1) 92%,transparent) 104% 8%/260px 260px no-repeat,
  radial-gradient(circle closest-side at 34% 30%,rgba(255,255,255,.75),transparent) 94% 92%/420px 420px no-repeat,
  radial-gradient(circle closest-side at 50% 50%,rgba(255,255,255,.3),rgba(255,255,255,.12) 60%,rgba(0,0,0,.1) 92%,transparent) 94% 92%/420px 420px no-repeat,
  radial-gradient(circle closest-side at 34% 30%,rgba(255,255,255,.75),transparent) 2% 4%/150px 150px no-repeat,
  radial-gradient(circle closest-side at 50% 50%,rgba(255,255,255,.3),rgba(255,255,255,.12) 60%,rgba(0,0,0,.1) 92%,transparent) 2% 4%/150px 150px no-repeat,
  repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 46px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.045) 0 1px,transparent 1px 46px)}
body[data-th]{--gut:max(28px,calc(50vw - 410px))}
body[data-th] #app{position:relative;z-index:1;width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;padding:0 var(--gut) 90px;overflow:hidden;border-radius:0;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(246,249,251,.95));
 box-shadow:0 0 70px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.25)}

/* Spanish under the English */
.esspk{display:inline-block;margin-left:5px;font-size:.85em;line-height:1;padding:2px 4px;border-radius:8px;cursor:pointer;opacity:.75;vertical-align:baseline;filter:saturate(.6)}
.esspk:hover,.esspk:focus{opacity:1;background:rgba(180,65,15,.12);outline:none}
.es{display:block;font-size:.78em;font-weight:500;color:#b4410f;line-height:1.25;letter-spacing:normal;text-transform:none}
button .es,.chip .es,.tabs .es,.tag .es{color:inherit;opacity:.85}
.meta .es,b .es,.qlab .es,.stn .es,.qa>span .es{display:inline;margin-left:6px}h1 .es,h2 .es,h3 .es,h4 .es,label .es,summary .es,legend .es,p .es,.fl .es,.fh .es,.sigcard .es,th .es{display:inline;margin-left:8px;margin-top:0}
h1 .es,h2 .es,h3 .es{font-size:.62em;margin-top:2px}
label .es{font-size:.85em}
/* ---------- staff sign-in ---------- */
body[data-th=signin] #app{background:transparent!important;box-shadow:none!important}
body[data-th=signin] #hdr{display:none}
.si{min-height:calc(100vh - 40px);min-height:calc(100dvh - 40px);display:flex;align-items:center;justify-content:center;padding:24px 0}
.sicard{width:100%;max-width:400px;background:rgba(255,255,255,.96);border-radius:30px;padding:28px 26px 18px;text-align:center;box-shadow:0 30px 80px rgba(10,14,40,.45),0 0 0 1px rgba(255,255,255,.6) inset;backdrop-filter:blur(6px)}
.silogo{width:138px;margin:0 auto 6px}.silogo svg{display:block;width:100%;height:auto}
.sicard h1{margin:6px 0 0;font-size:30px;color:#1a1f3d}.sicard h1 span{display:block;font-size:16px;font-weight:600;color:#b4410f;margin-top:2px}
.sisub{margin:8px 0 14px;color:#5a6378;font-size:16px}
.sidots{display:flex;justify-content:center;gap:18px;margin:4px 0 6px}.sidots i{width:20px;height:20px;border-radius:50%;border:3px solid #3d4a9e;transition:transform .15s,background .15s}.sidots i.on{background:#3d4a9e;transform:scale(1.12)}
.sipin{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.sierr{min-height:22px;margin:6px 0;color:var(--alert);font-weight:600;font-size:15px}
.sipad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px auto 10px;max-width:300px}
.sipad .pk{width:100%;aspect-ratio:1.35;min-height:0;margin:0;padding:0;border-radius:20px;border:2px solid #d7dbef;background:#fff;font-size:28px;font-weight:700;color:#1a1f3d;text-align:center;box-shadow:0 4px 0 #d7dbef;transition:transform .06s,box-shadow .06s}
.sipad .pk:active{transform:translateY(3px);box-shadow:0 1px 0 #d7dbef}.sipad .pkx{color:#7a819a;font-size:24px}.sipad .pkok{background:linear-gradient(180deg,#5563c1,#34408f);color:#fff;border-color:#34408f;box-shadow:0 4px 0 #262f6e}
.sifoot{margin:6px 0 0;font-size:12.5px;color:#8a90a6;letter-spacing:.5px}
.sicard.shake{animation:shk .4s}@keyframes shk{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@media(prefers-reduced-motion:reduce){.sicard.shake{animation:none}}
body[data-th=signin] .demopins{max-width:400px;margin:-10px auto 30px;background:rgba(255,255,255,.92)}
/* ---------- mission logo + station icon ---------- */
body[data-th] #app::before{display:none!important}
.hdr{display:flex;align-items:center;gap:14px;margin:0 calc(-1 * var(--gut)) 18px;padding:max(10px,env(safe-area-inset-top)) calc(var(--gut) + 64px) 10px var(--gut);color:#fff;
 background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),linear-gradient(100deg,var(--t1),var(--t2));box-shadow:0 6px 14px -6px rgba(0,0,0,.5);text-shadow:0 2px 3px rgba(0,0,0,.3)}
.hlogo{display:flex;align-items:center;gap:8px;padding-right:14px;border-right:2px solid rgba(255,255,255,.35)}.hlogo svg{width:58px;height:auto;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.hlt{font:800 15px/1 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:3px}.hlt small{display:block;font-size:9.5px;letter-spacing:1.6px;margin-top:3px;opacity:.9}
.hst{display:flex;align-items:center;gap:10px;min-width:0}.hst .sti{width:34px;height:34px;flex:none}
.hname{font-weight:800;letter-spacing:3px;font-size:18px;text-transform:uppercase;line-height:1.1}.hname small{display:block;font-size:12px;letter-spacing:1.5px;font-weight:600;opacity:.9;text-transform:none}
#sideL,#sideR{display:none}
@media(min-width:1180px){
 #sideL,#sideR{display:flex;position:fixed;top:0;bottom:0;z-index:2;align-items:center;justify-content:center;width:calc(50vw - 410px);padding:0 22px;pointer-events:none}
 #sideL{left:0}#sideR{right:0}#sideL[hidden],#sideR[hidden]{display:none}
 .sidecard{width:100%;max-width:250px;background:#fff;border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px rgba(0,0,0,.35);text-align:center}
 .sidecard svg{display:block;width:100%;height:auto}
 .sidecard.st{color:var(--pri)}.stbig{width:62%!important;margin:0 auto 10px;background:var(--soft);border-radius:50%;padding:16px;box-sizing:content-box;stroke-width:2.6}
 .stbig .f,.sti .f{fill:currentColor}
 .stn{font:800 21px/1.15 -apple-system,"Segoe UI",Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--t1)}.ste{font-size:17px;color:var(--pri);font-weight:600;margin-top:4px}
 .hlogo{display:none}}
@media(max-width:560px){.hlt{display:none}.hlogo{padding-right:10px}.hlogo svg{width:46px}.hname{font-size:15px;letter-spacing:2px}.hst .sti{width:28px;height:28px}}
.sti .f{fill:currentColor}

.sigauto{display:flex;align-items:center;gap:12px;margin:12px 0 0;padding:12px 14px;border:2px solid var(--line);border-radius:14px;background:var(--soft);font-size:18px;cursor:pointer;line-height:1.3}
.sigauto input{width:30px;height:30px;flex:none;accent-color:var(--pri)}.sigauto .ens{font-size:14px}
.sigpop{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.sigcard{background:#fff;color:#1d2b33;border-radius:20px;padding:18px;width:100%;max-width:620px;box-shadow:0 30px 80px rgba(0,0,0,.5)}.sigcard h2{margin:0 0 2px}
.sigwrap{position:relative;margin:12px 0 0;border:2px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
.sigwrap canvas{display:block;touch-action:none;position:relative;z-index:1;cursor:crosshair}
.sigline{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:2px solid #c3ced4;color:#9aa8b0;font-size:22px;padding-bottom:2px}.sigline span{font-size:13px;position:absolute;left:0;top:34px;white-space:nowrap}
.sigbtns{display:flex;gap:8px}.sigbtns button{flex:1;margin:0;min-height:0;padding:12px 8px}.sigbtns #sigok{flex:1.6}
#sigsame{margin:0 0 8px;min-height:0;padding:10px}
.fbox .fpath{font:600 18px/1.35 Consolas,"Courier New",monospace;background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0;word-break:break-all}
.fbox b,.fpick b{font-size:inherit}
.form .fld>label{font-weight:700}.form .fld>label .es{font-weight:500}
.form .fh{margin:18px 0 6px;padding-top:10px;border-top:2px solid var(--line);font-size:19px}.form label.fl{display:block;font-size:16px;margin:10px 0 4px}
.qa2{border:2px solid var(--line);border-radius:12px;margin:6px 0;background:#fff}.qa2.open{border-color:var(--pri)}
button.qrow{display:flex;align-items:center;gap:10px;width:100%;margin:0;min-height:0;padding:11px 12px;border:0;background:transparent;text-align:left;font-size:17px;border-radius:12px}
.qarr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--pri);display:flex;align-items:center;justify-content:center;font-size:15px}

  var c=pan.querySelector("#dn_copy");if(c)c.onclick=function(){var t=text();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){msg("Copied. Paste it into an email or WhatsApp.")},function(){showText(t)});else showText(t)};
  var s=pan.querySelector("#dn_save");if(s)s.onclick=saveFile}
 function msg(t){var m=pan&&pan.querySelector("#dn_msg");if(m)m.textContent=t}
 function showText(t){var ta=pan.querySelector("#dn_t");ta.value=t;ta.rows=10;ta.select();msg("Select all and copy this text.")}
 function saveFile(){var t=text(),name="Clinic app review notes.txt";
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(function(d){if(!d)return showText(t);d.save({filename:name,data:t}).then(function(){msg("Saved.")},function(e){msg(e&&e.code=="declined"?"Not saved.":"Could not save here. Use Copy all instead.")})});return}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);msg("Saved to your Downloads folder.")}catch(e){showText(t)}}
 btn.onclick=function(){if(pan){pan.remove();pan=null;return}pan=document.createElement("div");pan.id="dnpan";pan.className="noes";document.body.appendChild(pan);render()};
